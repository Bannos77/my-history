<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyHistory Antwerpen - Persoon bronnen</title>
  </head>

  <body>
    <main class="person-screen">
      <section class="result-screen">
        <button class="small-nav-button result-back-button js-link" data-link="person-search.html">
          Terug
        </button>

        <img
          class="result-logo"
          src="/src/assets/myhistory-logo.png"
          alt="MyHistory Antwerpen"
        />

        <nav class="result-top-nav">
          <button class="small-nav-button js-link" data-link="address.html">Adres</button>
          <button class="small-nav-button js-link" data-link="period.html">Periode</button>
          <button class="small-nav-button js-link" data-link="theme.html">Thema</button>
          <button class="small-nav-button js-link" data-link="login.html">Login</button>
        </nav>

        <aside class="result-left">
          <h1>Persoon</h1>

          <input
            class="result-search-input"
            type="text"
            placeholder="Zoeken"
          />

          <h2>Recente zoekopdrachten</h2>

          <ul class="result-recent-searches">
          </ul>
        </aside>

        <section class="result-book">
          <div class="result-book-paper">
            <div class="result-book-left result-detail-left">
              <nav class="result-book-links result-book-links-detail">
                <button class="js-link" data-link="person-result.html">Bio</button>
                <button class="js-link" data-link="person-result-images">Afbeeldingen</button>
                <button class="js-link" data-link="person-result-files">Bestanden</button>
                <button class="js-link" data-link="person-result-info.html">Informatie</button>
                <button class="js-link" data-link="person-result-family">Familie</button>
                <button class="active">Bronnen</button>
              </nav>
            </div>

            <div class="result-book-right sources-page">
              <div class="sources-section">
                <h2>Eigen uploads</h2>

                <ul>
                  <li>Familie_Martinez.pdf</li>
                  <li>Geboorteakte.pdf</li>
                </ul>
              </div>

              <div class="sources-section">
                <h2>Documenten</h2>

                <ul>
                  <li>Scan_001.pdf</li>
                  <li>Foto_2022.jpg</li>
                </ul>
              </div>

              <div class="sources-section">
                <h2>Archiefbronnen</h2>

                <ul>
                  <li>FelixArchief Antwerpen</li>
                </ul>
              </div>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
