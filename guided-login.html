<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login opties - MyHistory Antwerpen</title>
</head>

<body>
  <main class="choice-screen">

    <button class="small-nav-button back-button js-link" data-link="choice.html">
      Terug
    </button>

    <img 
      src="/src/assets/myhistory-logo.png" 
      alt="MyHistory Antwerpen logo" 
      class="choice-logo"
    />

    <section class="choice-content">

      <button class="choice-card" data-link="badge.html">
        <img 
          src="/src/assets/icon-badge.png" 
          alt="" 
          class="choice-icon"
        />

        <span>Badge</span>
      </button>

      <button class="choice-card" data-link="email-login.html">
        <img 
          src="/src/assets/icon-email.png" 
          alt="" 
          class="choice-icon"
        />

        <span>Login via<br>e-mail</span>
      </button>

    </section>

  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
