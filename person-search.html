<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Persoon zoeken - MyHistory Antwerpen</title>
</head>

<body>
  <main class="person-screen">

    <button class="small-nav-button back-button js-link" data-link="dashboard.html">
      Terug
    </button>

    <img 
      src="/src/assets/myhistory-logo.png" 
      alt="MyHistory Antwerpen logo" 
      class="person-logo"
    />

    <nav class="top-nav">
      <button class="small-nav-button js-link" data-link="address-search.html">Adres</button>
      <button class="small-nav-button js-link" data-link="period-search.html">Periode</button>
      <button class="small-nav-button js-link" data-link="theme-search.html">Thema</button>
      <button class="small-nav-button js-link" data-link="login.html">Login</button>
    </nav>

    <section class="person-left">
      <h1>Persoon</h1>

      <input 
        type="text" 
        class="search-input" 
        id="personSearchInput"
        placeholder="Zoeken"
      />

      <h2>Recente zoekopdrachten</h2>

      <ul class="recent-searches">
      </ul>
    </section>

    <section class="archive-book">

      <div class="name-list" id="nameList">
        <h2>“A”</h2>

        <button class="name-result js-link" data-link="person-result.html">Ana G.</button>
        <button class="name-result js-link" data-link="person-result.html">Anaïs J.</button>
        <button class="name-result js-link" data-link="person-result.html">Ann R.</button>
        <button class="name-result js-link" data-link="person-result.html">Anne R.</button>
      </div>

      <div class="alphabet-tabs">
        <button class="alphabet-tab active" data-letter="A">A</button>
        <button class="alphabet-tab" data-letter="B">B</button>
        <button class="alphabet-tab" data-letter="C">C</button>
        <button class="alphabet-tab" data-letter="D">D</button>
        <button class="alphabet-tab" data-letter="E">E</button>
        <button class="alphabet-tab" data-letter="F">F</button>
        <button class="alphabet-tab" data-letter="G">G</button>
        <button class="alphabet-tab" data-letter="H">H</button>
        <button class="alphabet-tab" data-letter="I">I</button>
        <button class="alphabet-tab" data-letter="J">J</button>
        <button class="alphabet-tab" data-letter="K">K</button>
        <button class="alphabet-tab" data-letter="L">L</button>
        <button class="alphabet-tab" data-letter="M">M</button>
        <button class="alphabet-tab" data-letter="N">N</button>
        <button class="alphabet-tab" data-letter="O">O</button>
        <button class="alphabet-tab" data-letter="P">P</button>
        <button class="alphabet-tab" data-letter="Q">Q</button>
        <button class="alphabet-tab" data-letter="R">R</button>
        <button class="alphabet-tab" data-letter="S">S</button>
        <button class="alphabet-tab" data-letter="T">T</button>
        <button class="alphabet-tab" data-letter="U">U</button>
        <button class="alphabet-tab" data-letter="V">V</button>
        <button class="alphabet-tab" data-letter="W">W</button>
        <button class="alphabet-tab" data-letter="X">X</button>
        <button class="alphabet-tab" data-letter="Y">Y</button>
        <button class="alphabet-tab" data-letter="Z">Z</button>
      </div>

    </section>

  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
